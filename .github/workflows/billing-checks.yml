name: Billing persistence

on:
  push:
    paths:
      - 'services/billing/**'
      - 'packages/python_common/**'
      - 'tests/e2e/replay_q03_billing.py'
      - '.github/workflows/billing-checks.yml'
  pull_request:
    paths:
      - 'services/billing/**'
      - 'packages/python_common/**'
      - 'tests/e2e/replay_q03_billing.py'
      - '.github/workflows/billing-checks.yml'

permissions:
  contents: read

jobs:
  billing:
    name: Billing PostgreSQL and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/billing
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: b01-local-admin
          POSTGRES_DB: telelink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telelink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://billing:local-demo-only@127.0.0.1:5432/telelink
      BILLING_TEST_ALLOW_RESET: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: services/billing/requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e ../../packages/python_common -e .
      - name: Provision disposable schema and sentinels
        env:
          PGPASSWORD: b01-local-admin
        run: |
          psql -h 127.0.0.1 -U postgres -d telelink -v ON_ERROR_STOP=1 -f scripts/create-local-schema.sql
          psql -h 127.0.0.1 -U postgres -d telelink -v ON_ERROR_STOP=1 -f scripts/create-test-sentinel.sql
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m ruff check ../../tests/e2e/replay_q03_billing.py --config pyproject.toml
      - run: python -m ruff format --check ../../tests/e2e/replay_q03_billing.py --config pyproject.toml
      - run: python -m pip check
      - run: python -m pytest -q
