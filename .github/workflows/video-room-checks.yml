name: Video room browser checks
on:
  push:
    paths: ['apps/web/src/features/video/**', 'apps/web/tests/browser/**', 'apps/web/playwright.video.config.mjs', 'apps/web/package*.json', 'services/signalling/**', '.github/workflows/video-room-checks.yml']
  pull_request:
    paths: ['apps/web/src/features/video/**', 'apps/web/tests/browser/**', 'apps/web/playwright.video.config.mjs', 'apps/web/package*.json', 'services/signalling/**', '.github/workflows/video-room-checks.yml']
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    env:
      SIGNALLING_SECRET: v03-test-only-signalling-secret-at-least-32-bytes
      CONSULTATION_URL: http://host.docker.internal:9050
      CONSULTATION_UPSTREAM: host.docker.internal:9050
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose -f ../../services/signalling/compose.yaml -f tests/browser/compose.yaml up --build --wait --wait-timeout 90
      - run: npx playwright test --config playwright.video.config.mjs
      - run: node tests/browser/turn.mjs
      - if: always()
        run: docker compose -f ../../services/signalling/compose.yaml -f tests/browser/compose.yaml down
