name: Identity persistence

on:
  push:
    paths:
      - 'services/identity/**'
      - '.github/workflows/identity-checks.yml'
  pull_request:
    paths:
      - 'services/identity/**'
      - '.github/workflows/identity-checks.yml'

permissions:
  contents: read

jobs:
  persistence:
    name: Identity PostgreSQL and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/identity
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: a04-local-admin
          POSTGRES_DB: telelink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telelink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://identity:local-demo-only@127.0.0.1:5432/telelink
      IDENTITY_TEST_ALLOW_RESET: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: services/identity/requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - name: Provision disposable service schema
        env:
          PGPASSWORD: a04-local-admin
        run: psql -h 127.0.0.1 -U postgres -d telelink -v ON_ERROR_STOP=1 -f scripts/create-local-schema.sql
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
