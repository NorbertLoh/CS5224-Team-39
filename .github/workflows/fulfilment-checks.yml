name: Fulfilment persistence and APIs

on:
  push:
    paths:
      - 'services/fulfilment/**'
      - 'packages/python_common/**'
      - 'tests/e2e/check_i03_journey.py'
      - '.github/workflows/fulfilment-checks.yml'
  pull_request:
    paths:
      - 'services/fulfilment/**'
      - 'packages/python_common/**'
      - 'tests/e2e/check_i03_journey.py'
      - '.github/workflows/fulfilment-checks.yml'

permissions:
  contents: read

jobs:
  fulfilment:
    name: Fulfilment PostgreSQL, APIs and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/fulfilment
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: d01-local-admin
          POSTGRES_DB: telelink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telelink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://fulfilment:local-demo-only@127.0.0.1:5432/telelink
      FULFILMENT_TEST_ALLOW_RESET: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: services/fulfilment/requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e ../../packages/python_common
      - name: Provision disposable schema and protected sentinel
        env:
          PGPASSWORD: d01-local-admin
        run: |
          psql -h 127.0.0.1 -U postgres -d telelink -v ON_ERROR_STOP=1 -f scripts/create-local-schema.sql
          psql -h 127.0.0.1 -U postgres -d telelink -v ON_ERROR_STOP=1 -f scripts/create-test-sentinel.sql
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m ruff check ../../tests/e2e/check_i03_journey.py --config pyproject.toml
      - run: python -m ruff format --check ../../tests/e2e/check_i03_journey.py --config pyproject.toml
      - run: python -m pytest -q
      - name: Verify protected sentinel survived
        env:
          PGPASSWORD: d01-local-admin
        run: test "$(psql -h 127.0.0.1 -U postgres -d telelink -Atc 'SELECT count(*) FROM public.d01_sentinel')" = 1
