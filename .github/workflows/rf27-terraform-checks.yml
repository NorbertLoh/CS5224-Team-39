name: RF27 AWS runtime configuration
on:
  push:
    paths: ['infra/modules/background-jobs/**', 'infra/modules/public-edge/**', '.github/workflows/rf27-terraform-checks.yml']
  pull_request:
    paths: ['infra/modules/background-jobs/**', 'infra/modules/public-edge/**', '.github/workflows/rf27-terraform-checks.yml']
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [background-jobs, public-edge]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
      - run: terraform fmt -check -recursive
        working-directory: infra/modules/${{ matrix.module }}
      - run: terraform init -backend=false -input=false -lockfile=readonly
        working-directory: infra/modules/${{ matrix.module }}
      - run: terraform validate
        working-directory: infra/modules/${{ matrix.module }}
      - run: terraform test
        working-directory: infra/modules/${{ matrix.module }}
