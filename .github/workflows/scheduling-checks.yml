name: Scheduling persistence

on:
  push:
    paths:
      - 'services/scheduling/**'
      - 'packages/python_common/**'
      - 'dev/check_scheduling_integration.py'
      - 'dev/check_booking_holds.py'
      - '.github/workflows/scheduling-checks.yml'
  pull_request:
    paths:
      - 'services/scheduling/**'
      - 'packages/python_common/**'
      - 'dev/check_scheduling_integration.py'
      - 'dev/check_booking_holds.py'
      - '.github/workflows/scheduling-checks.yml'

permissions:
  contents: read

jobs:
  persistence:
    name: Scheduling PostgreSQL, Redis and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/scheduling
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: s01-local-admin
          POSTGRES_DB: telelink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telelink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://scheduling:local-demo-only@127.0.0.1:5432/telelink
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      SCHEDULING_TEST_ALLOW_RESET: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: services/scheduling/requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e ../../packages/python_common
      - name: Provision disposable service schema and sentinel
        env:
          PGPASSWORD: s01-local-admin
        run: |
          psql -h 127.0.0.1 -U postgres -d telelink -v ON_ERROR_STOP=1 -f scripts/create-local-schema.sql
          psql -h 127.0.0.1 -U postgres -d telelink -v ON_ERROR_STOP=1 -f scripts/create-test-sentinel.sql
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m ruff check ../../dev/check_scheduling_integration.py --config pyproject.toml
      - run: python -m ruff format --check ../../dev/check_scheduling_integration.py --config pyproject.toml
      - run: python -m ruff check ../../dev/check_booking_holds.py --config pyproject.toml
      - run: python -m ruff format --check ../../dev/check_booking_holds.py --config pyproject.toml
      - run: python -m pytest -q
