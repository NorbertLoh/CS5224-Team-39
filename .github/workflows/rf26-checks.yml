name: RF26 Lambda images
on:
  push:
    paths: ['services/document/**', 'services/notification/**', 'packages/python_common/**', '.github/workflows/rf26-checks.yml']
  pull_request:
    paths: ['services/document/**', 'services/notification/**', 'packages/python_common/**', '.github/workflows/rf26-checks.yml']
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [document, notification]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile.lambda
          build-contexts: python_common=packages/python_common
          platforms: linux/amd64
          provenance: false
          push: false
          cache-from: type=gha,scope=rf26-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=rf26-${{ matrix.service }}
