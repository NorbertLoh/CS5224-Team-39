name: Release preparation
on:
  pull_request:
    paths: ['dev/release/**', 'apps/web/Dockerfile.release', '.github/workflows/release-checks.yml']
  push:
    paths: ['dev/release/**', 'apps/web/Dockerfile.release', '.github/workflows/release-checks.yml']
permissions:
  contents: read
jobs:
  tooling-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test dev/release/release.test.mjs
      - run: node dev/release/release.mjs frontend dev/release/frontend.check.json
