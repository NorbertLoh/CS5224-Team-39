name: Demo seed checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  safeguards:
    name: Local seed safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dev/demo_seed/requirements.txt
      - run: python -m pip install -r dev/demo_seed/requirements.txt ruff ./packages/python_common
      - run: python -m ruff check dev/demo_seed --config services/template/pyproject.toml
      - run: python -m unittest discover -s dev/demo_seed -p "test_*.py" -v

  aws-reset-database:
    name: AWS reset seed on disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: rf57_reset_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rf57_reset_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RESET_TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/rf57_reset_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/identity/requirements.lock.txt
            dev/demo_seed/requirements.txt
      - run: python -m pip install -r services/identity/requirements.lock.txt -r dev/demo_seed/requirements.txt ./packages/python_common
      - run: python -m unittest discover -s dev/demo_seed -p "test_aws_reset*.py" -v
