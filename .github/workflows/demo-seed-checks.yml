name: Demo seed checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  safeguards:
    name: Local seed safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dev/demo_seed/requirements.txt
      - run: python -m pip install -r dev/demo_seed/requirements.txt ruff
      - run: python -m ruff check dev/demo_seed --config services/template/pyproject.toml
      - run: python -m unittest discover -s dev/demo_seed -p "test_*.py" -v
