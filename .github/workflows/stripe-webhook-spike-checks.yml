name: Stripe webhook spike

on:
  push:
    paths:
      - 'services/billing/spike/**'
      - '.github/workflows/stripe-webhook-spike-checks.yml'
  pull_request:
    paths:
      - 'services/billing/spike/**'
      - '.github/workflows/stripe-webhook-spike-checks.yml'

permissions:
  contents: read

jobs:
  webhook:
    name: X04 raw-body callback and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: services/billing/spike/requirements.lock.txt
      - run: python -m pip install -r services/billing/spike/requirements.lock.txt
      - run: python -m pip check
      - run: python -m ruff check services/billing/spike
      - run: python -m ruff format --check services/billing/spike
      - run: python -m pytest services/billing/spike -q
