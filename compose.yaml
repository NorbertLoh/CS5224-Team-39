name: telelink

services:
  template:
    build:
      context: ./services/template
      additional_contexts:
        python_common: ./packages/python_common
      target: production
    ports:
      - "127.0.0.1:${TEMPLATE_HOST_PORT:-8000}:8000"
    environment:
      SERVICE_NAME: template
      SERVICE_ENVIRONMENT: local
      SERVICE_DOCS_ENABLED: "true"
      SERVICE_ROOT_PATH: /api/v1/template

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telelink}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telelink-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bootstrap:
    image: amazon/aws-cli:2.37.11
    profiles: ["bootstrap"]
    depends_on:
      floci:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
      COGNITO_BASE_URL: http://localhost:${FLOCI_PORT:-4566}
      COGNITO_CALLBACK_URL: ${COGNITO_CALLBACK_URL:-http://localhost:5173/auth/callback}
      COGNITO_LOGOUT_URL: ${COGNITO_LOGOUT_URL:-http://localhost:5173/}
    volumes:
      - ./dev/floci:/bootstrap:ro

  floci:
    image: ${FLOCI_IMAGE:-floci/floci:2.2.0@sha256:e97cd0c1dc2aa14e7697fb5ef5018404c4d6345169dbd276315f0bed2c7b0520}
    profiles: ["offline"]
    environment:
      FLOCI_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      FLOCI_BASE_URL: http://localhost:${FLOCI_PORT:-4566}
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_UI_ENABLED: "false"
      FLOCI_DNS_CONTAINER_FALLBACK_ENABLED: "false"
      EXTRA_CORS_ALLOWED_ORIGINS: ${COGNITO_CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:${FLOCI_PORT:-4566}:4566"
    volumes:
      - floci_data:/app/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    stop_grace_period: 30s

volumes:
  postgres_data:
  redis_data:
  floci_data:
