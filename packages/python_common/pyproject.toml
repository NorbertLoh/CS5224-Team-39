[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telelink-python-common"
version = "0.1.0"
description = "Shared TeleLink authentication, access, event and service foundations"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1", "pydantic-settings>=2.6,<3", "PyJWT[crypto]>=2.10,<3",
    "SQLAlchemy>=2.0,<2.1", "httpx>=0.27,<1",
]

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]

[tool.setuptools.packages.find]
include = ["telelink_common*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
