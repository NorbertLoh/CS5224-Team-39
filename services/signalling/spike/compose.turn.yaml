name: telelink-x01
services:
  turn:
    image: coturn/coturn:4.6.3@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888
    # Use on a Linux host with a reachable public IP; see README for NAT mapping.
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./.local/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./.local/tls:/etc/coturn/tls:ro
    restart: "no"
