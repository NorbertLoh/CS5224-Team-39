services:
  template:
    image: telelink-template:local
    build:
      context: .
      target: production
    ports:
      - "127.0.0.1:${TEMPLATE_HOST_PORT:-8000}:8000"
    environment:
      SERVICE_NAME: template
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: "8000"
      SERVICE_ENVIRONMENT: production
